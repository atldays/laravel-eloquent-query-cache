name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  pint:
    name: Pint
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none
          tools: composer:v2

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-pint-${{ hashFiles('composer.json') }}
          restore-keys: composer-pint-

      - name: Install dependencies
        run: |
          composer validate --strict --no-check-lock
          composer update --prefer-dist --no-interaction

      - name: Audit dependencies
        run: composer test:security

      - name: Run Pint
        run: vendor/bin/pint --test

  tests:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.prefer }}
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        prefer: [prefer-lowest, prefer-stable]
        include:
          - laravel: 12.*
            laravel-major: '12'
            testbench: ^10.12
            phpunit: ^12.5.44
          - laravel: 13.*
            laravel-major: '13'
            testbench: ^11.3
            phpunit: ^13.4.7
          - php: '8.2'
            phpunit: ^11.5.58
          - php: '8.3'
            phpunit: ^12.5.44
        exclude:
          - php: '8.2'
            laravel: 13.*

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: pcov
          tools: composer:v2

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-php-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.prefer }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-php-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.prefer }}-
            composer-php-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-interaction --no-update -W
          composer update -W --${{ matrix.prefer }} --prefer-dist --no-interaction

      - name: Audit dependencies
        run: composer test:security

      - name: Run tests
        run: |
          CACHE_DRIVER="array" vendor/bin/phpunit --coverage-text --coverage-clover=coverage_array.xml --coverage-html=coverage/array
          CACHE_DRIVER="file" vendor/bin/phpunit --coverage-text --coverage-clover=coverage_file.xml --coverage-html=coverage/file

      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-php-${{ matrix.php }}-laravel-${{ matrix.laravel-major }}-${{ matrix.prefer }}
          path: |
            coverage_array.xml
            coverage_file.xml
            coverage/
          if-no-files-found: error
          retention-days: 14

  postgres:
    name: PostgreSQL 17 - Laravel ${{ matrix.laravel-major }}
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: 12.*
            laravel-major: '12'
            testbench: ^10.12
            phpunit: ^12.5.44
          - laravel: 13.*
            laravel-major: '13'
            testbench: ^11.3
            phpunit: ^13.4.7

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: query_cache_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d query_cache_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      QUERY_CACHE_PGSQL_USER: postgres
      QUERY_CACHE_PGSQL_PASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_pgsql, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-postgres-8.5-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-postgres-8.5-${{ matrix.laravel }}-
            composer-php-8.5-${{ matrix.laravel }}-prefer-stable-

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-interaction --no-update -W
          composer update -W --prefer-stable --prefer-dist --no-interaction

      - name: Audit dependencies
        run: composer test:security

      - name: Run PostgreSQL lock tests
        env:
          QUERY_CACHE_PGSQL_DSN: pgsql:host=127.0.0.1;port=${{ job.services.postgres.ports['5432'] }};dbname=query_cache_test
        run: |
          mkdir -p build
          vendor/bin/phpunit --filter PostgresLockTest --fail-on-skipped --fail-on-empty-test-suite --log-junit=build/postgres-tests.xml

      - name: Upload PostgreSQL test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-laravel-${{ matrix.laravel-major }}-attempt-${{ github.run_attempt }}
          path: build/postgres-tests.xml
          if-no-files-found: ignore
          retention-days: 14
