name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  pint:
    name: Pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none
          tools: composer:v2

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-pint-${{ hashFiles('composer.json') }}
          restore-keys: composer-pint-

      - name: Install dependencies
        run: |
          composer validate --strict --no-check-lock
          composer update --prefer-dist --no-interaction

      - name: Audit dependencies
        run: composer test:security

      - name: Run Pint
        run: vendor/bin/pint --test

  tests:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.prefer }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        prefer: [prefer-lowest, prefer-stable]
        include:
          - laravel: 12.*
            testbench: ^10.12
            phpunit: ^12.5.44
          - laravel: 13.*
            testbench: ^11.3
            phpunit: ^13.4.7
          - php: '8.2'
            phpunit: ^11.5.58
          - php: '8.3'
            phpunit: ^12.5.44
        exclude:
          - php: '8.2'
            laravel: 13.*

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: pcov
          tools: composer:v2

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-php-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.prefer }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-php-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.prefer }}-
            composer-php-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-interaction --no-update -W
          composer update -W --${{ matrix.prefer }} --prefer-dist --no-interaction

      - name: Audit dependencies
        run: composer test:security

      - name: Run tests
        run: |
          CACHE_DRIVER="array" vendor/bin/phpunit --coverage-text --coverage-clover=coverage_array.xml
          CACHE_DRIVER="file" vendor/bin/phpunit --coverage-text --coverage-clover=coverage_file.xml

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: false
          files: coverage_array.xml,coverage_file.xml
          disable_search: true
